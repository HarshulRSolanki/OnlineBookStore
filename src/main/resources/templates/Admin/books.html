<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Editions – Quickread Admin</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>
<body>

    <!-- Header Navigation -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <!-- Header -->
            <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 pb-3 border-bottom gap-3">
                <div>
                    <span class="section-subtitle-tag mb-1">Catalog Registry</span>
                    <h1 class="font-heading fs-2 mb-0">Book Inventory &amp; Engagement</h1>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/books/report/pdf}" class="btn-luxury-outline py-2 px-3">
                        <i class="fas fa-file-pdf text-danger me-1"></i> Export PDF Report
                    </a>
                    <a href="/admindash" class="btn-luxury-primary py-2 px-3">
                        <i class="fas fa-gauge me-1"></i> Admin Dashboard
                    </a>
                </div>
            </div>

            <div class="orders-table-wrapper">
                <div class="table-responsive">
                    <table class="luxury-table">
                        <thead>
                            <tr>
                                <th>Book Title</th>
                                <th>Author</th>
                                <th>Category</th>
                                <th>ISBN</th>
                                <th>Price</th>
                                <th>In Carts</th>
                                <th>Downloads</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book : ${books}">
                                <td class="fw-bold text-dark" th:text="${book.title}">Title</td>
                                <td th:text="${book.author}">Author</td>
                                <td>
                                    <span class="badge" style="background: #FAF6EF; color: var(--primary-accent); border: 1px solid var(--border-color);"
                                          th:text="${book.category != null ? book.category.name : 'N/A'}">Category</span>
                                </td>
                                <td><code th:text="${book.isbn}">ISBN</code></td>
                                <td>
                                    <span class="fw-bold text-dark" th:if="${book.price > 0}">₹<span th:text="${book.price}"></span></span>
                                    <span class="badge bg-success" th:if="${book.price == 0}">Free</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${book.cartCount}">0</span>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:text="${book.downloadCount}">0</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-2">
                                        <form th:action="@{/updateBooks/{bookId}(bookId=${book.id})}" method="post">
                                            <button type="submit" class="btn btn-outline-secondary btn-sm" title="Edit Edition">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/deleteBooks}" method="post">
                                            <input type="hidden" name="bookId" th:value="${book.id}">
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete Edition" onclick="return confirm('Remove book from store?')">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>
</html>
