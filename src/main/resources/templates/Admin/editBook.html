<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Book</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
		body {
		        background-color: var(--light-bg);
				background-image:url('/img/free book.jpg'); 
		        min-height: 100vh;
		        display: flex;
				background-size: cover;                 /* makes the image cover the container */
				background-position: center center;     /* centers the image */
		        background-repeat: no-repeat;
				width: 100%; 
		           flex-direction: column;
		           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		       }

		
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .btn-warning {
            background-color: rgb(255, 255, 0);
            border: none;
        }
        .btn-warning:hover {
            background-color: rgb(255, 255, 128);
        }
        .cover-image {
            max-width: 200px; /* Set a max width for the cover image */
            margin-bottom: 20px; /* Space below the image */
        }
        .error-message {
            margin-top: 10px;
            color: #dc3545; /* Bootstrap danger color */
        }
        .form-group label {
            font-weight: bold; /* Make labels bold */
        }
		.glass-blur {
		    background: rgba(255, 255, 255, 0.15); /* slight white tint */
		    backdrop-filter: blur(10px);           /* the blur effect */
		    -webkit-backdrop-filter: blur(10px);   /* Safari support */
		    border-radius: 16px;
		    border: 1px solid rgba(255, 255, 255, 0.2);
		}

    </style>
</head>
<body >
	<header>
	<div th:replace="common/header :: navbar"></div>
	</header>
    <div class="container">
        <h1 class="mb-4 text-center fw-bold text-light">Edit Book</h1>

        <div class="card p-4 glass-blur fw-bold text-dark">
            <form th:action="@{/update/{bookId}(bookId=${book.id})}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:value="${book.id}" name="bookId" />

                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" pattern="[A-Za-z\s]+" title="Only letters and spaces are allowed" id="title" name="title" class="form-control" th:value="${book.title}" required />
                </div>

                <div class="form-group">
                    <label for="author">Author:</label>
                    <input type="text" pattern="[A-Za-z\s]+" title="Only letters and spaces are allowed" id="author" name="author" class="form-control" th:value="${book.author}" required />
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category" class="form-control" required>
                        <option th:each="category : ${categories}" 
                                th:value="${category.id}" 
                                th:text="${category.name}" 
                                th:selected="${category.id == book.category.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Upload New Cover Image (Optional)</label>
                    <input type="file" name="coverImage" accept="image/*" class="form-control-file">
                </div>

                <div class="form-group">
                    <label>Upload New PDF File (Optional)</label>
                    <input type="file" name="file" accept="application/pdf" class="form-control-file">
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN:</label>
                    <input type="text" id="isbn" name="isbn" class="form-control" th:value="${book.isbn}" required />
                </div>

                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" class="form-control" required th:text="${book.description}"></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Price:</label>
                    <input type="number" id="price" name="price" class="form-control" th:value="${book.price}" required />
                </div>
				
				<div class="form-group">
				    <label class="form-label">Language</label>
				    <select class="form-select" name="language" th:value="${book.language}">
				    	<option value="" disabled selected>Select language</option>
				        <option value="English">English</option>
				        <option value="Hindi">Hindi</option>
				    </select>
				</div>
				
				<div class="form-group">
					<label class="form-label">Publishing Date</label>
					<input type="date" class="form-control" name="publishDate" th:value="${book.publishDate}">
				</div>
				
				<div class="form-group">
					<label class="form-label">Publisher Name</label>
					<input type="text" class="form-control" pattern="[A-Za-z\s]+" title="Only letters and spaces are allowed" name="publishername" th:value="${book.publishername}" >
				</div>
				
                <button type="submit" class="btn btn-primary w-100">Update Book</button>
            </form>

            <div th:if="${error}" class="error-message">
                <p th:text="${error}"></p>
            </div>
        </div>
    </div>
	<div class="footer mt-auto">
	<div th:replace="common/footer :: footer"></div>
	</div>
    <!-- Bootstrap JS and dependencies (optional) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
