<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Edit ' + ${book.title} + ' – Quickread Admin'">Edit Book – Quickread</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>
<body>

    <!-- Dedicated Admin Header -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card p-4 p-md-5 border-0 shadow-md" style="background: var(--card-bg); border: 1px solid var(--border-color) !important; border-radius: var(--radius-lg);">
                        <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                            <div>
                                <span class="section-subtitle-tag mb-1">Catalog Curation</span>
                                <h1 class="font-heading fs-2 mb-0">Modify Book Edition</h1>
                            </div>
                            <a th:href="@{/admin/books}" class="btn-luxury-outline py-2 px-3">
                                <i class="fas fa-arrow-left me-1"></i> Back to Manage Books
                            </a>
                        </div>

                        <!-- Alerts -->
                        <div th:if="${error != null or message != null}" class="mb-4">
                            <div class="editorial-alert editorial-alert-danger" th:if="${error}">
                                <i class="fas fa-exclamation-circle"></i>
                                <span th:text="${error}">Error</span>
                            </div>
                            <div class="editorial-alert editorial-alert-success" th:if="${message}">
                                <i class="fas fa-check-circle"></i>
                                <span th:text="${message}">Success</span>
                            </div>
                        </div>

                        <!-- Update Form -->
                        <form th:action="@{/admin/books/edit/{bookId}(bookId=${book.id})}" method="post" enctype="multipart/form-data">
                            <div class="row g-4">
                                <div class="col-md-6 auth-form-group">
                                    <label for="title" class="auth-form-label">Title</label>
                                    <input type="text" id="title" name="title" class="auth-input-field" th:value="${book.title}" required />
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="author" class="auth-form-label">Author</label>
                                    <input type="text" id="author" name="author" class="auth-input-field" th:value="${book.author}" required />
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="category" class="auth-form-label">Category</label>
                                    <select id="category" name="category" class="editorial-select" required style="padding-left: 1rem;">
                                        <option th:each="cat : ${categories}"
                                                th:value="${cat.id}"
                                                th:text="${cat.name}"
                                                th:selected="${book.category != null and cat.id == book.category.id}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="isbn" class="auth-form-label">ISBN Reference</label>
                                    <input type="text" id="isbn" name="isbn" class="auth-input-field" th:value="${book.isbn}" required />
                                </div>

                                <div class="col-md-4 auth-form-group">
                                    <label for="price" class="auth-form-label">Price (INR)</label>
                                    <input type="number" id="price" name="price" class="auth-input-field" th:value="${book.price}" required min="0" />
                                </div>

                                <div class="col-md-4 auth-form-group">
                                    <label for="stock" class="auth-form-label">Stock Quantity</label>
                                    <input type="number" id="stock" name="stock" class="auth-input-field" th:value="${book.stock != null ? book.stock : 0}" required min="0" />
                                </div>

                                <div class="col-md-4 auth-form-group">
                                    <label for="language" class="auth-form-label">Language</label>
                                    <input type="text" id="language" name="language" class="auth-input-field" th:value="${book.language}" />
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="publishername" class="auth-form-label">Publisher Name</label>
                                    <input type="text" id="publishername" name="publishername" class="auth-input-field" th:value="${book.publishername}" />
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="publishDate" class="auth-form-label">Publish Date</label>
                                    <input type="date" id="publishDate" name="publishDate" class="auth-input-field" th:value="${book.publishDate}" />
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label class="auth-form-label">Replace Cover Artwork (Optional)</label>
                                    <input type="file" name="coverImage" accept="image/*" class="form-control" />
                                    <small class="text-muted">Leave blank to retain current cover.</small>
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label class="auth-form-label">Replace PDF File (Optional)</label>
                                    <input type="file" name="file" accept="application/pdf" class="form-control" />
                                    <small class="text-muted">Leave blank to retain current digital file.</small>
                                </div>

                                <div class="col-12 auth-form-group">
                                    <label for="description" class="auth-form-label">Synopsis &amp; Description</label>
                                    <textarea id="description" name="description" rows="5" class="auth-input-field" th:text="${book.description}" style="padding-left: 1rem;"></textarea>
                                </div>
                            </div>

                            <div class="d-flex align-items-center justify-content-between mt-5 pt-3 border-top">
                                <a th:href="@{/admin/books}" class="btn-luxury-outline py-2 px-3">
                                    <i class="fas fa-times me-1"></i> Cancel
                                </a>
                                <button type="submit" class="btn-luxury-primary py-2 px-4">
                                    <i class="fas fa-check me-2"></i> Save Changes to Edition
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>
</html>
