<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories – Quickread Admin</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>
<body>

    <!-- Dedicated Admin Header -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 pb-3 border-bottom gap-3">
                <div>
                    <span class="section-subtitle-tag mb-1">Catalog Taxonomy</span>
                    <h1 class="font-heading fs-2 mb-0">Manage Categories</h1>
                </div>
                <a th:href="@{/admin/dashboard}" class="btn-luxury-outline py-2 px-3">
                    <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>

            <!-- Alerts -->
            <div th:if="${error != null or message != null}" class="mb-4">
                <div class="editorial-alert editorial-alert-danger" th:if="${error}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:text="${error}">Error</span>
                </div>
                <div class="editorial-alert editorial-alert-success" th:if="${message}">
                    <i class="fas fa-check-circle"></i>
                    <span th:text="${message}">Success</span>
                </div>
            </div>

            <div class="row g-4">
                <!-- Add Category Card -->
                <div class="col-lg-4">
                    <div class="card p-4 border-0 shadow-sm" style="background: var(--card-bg); border: 1px solid var(--border-color) !important; border-radius: var(--radius-md);">
                        <h3 class="font-heading fs-5 mb-3">Add New Category</h3>
                        <form th:action="@{/admin/categories/add}" method="post">
                            <div class="auth-form-group mb-3">
                                <label for="categoryName" class="auth-form-label">Category Name</label>
                                <input type="text" id="categoryName" class="auth-input-field" name="categoryName"
                                       placeholder="e.g. Philosophy, Sci-Fi, Architecture" required />
                            </div>
                            <button type="submit" class="btn-luxury-primary w-100 py-2">
                                <i class="fas fa-plus me-1"></i> Create Category
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Categories Table -->
                <div class="col-lg-8">
                    <div class="orders-table-wrapper">
                        <div class="table-responsive">
                            <table class="luxury-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Category Name</th>
                                        <th>Books Assigned</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categories}">
                                        <td><code th:text="${cat.id}">1</code></td>
                                        <td>
                                            <form th:action="@{/admin/categories/edit}" method="post" class="d-flex align-items-center gap-2">
                                                <input type="hidden" name="categoryId" th:value="${cat.id}" />
                                                <input type="text" name="categoryName" th:value="${cat.name}"
                                                       class="form-control form-control-sm" style="max-width: 240px;" required />
                                                <button type="submit" class="btn btn-outline-secondary btn-sm">Rename</button>
                                            </form>
                                        </td>
                                        <td>
                                            <span class="badge bg-light text-dark border"
                                                  th:text="${categoryBookCounts != null and categoryBookCounts.containsKey(cat.id) ? categoryBookCounts.get(cat.id) : 0}">0</span>
                                        </td>
                                        <td class="text-end">
                                            <form th:action="@{/admin/categories/delete}" method="post" class="m-0 d-inline">
                                                <input type="hidden" name="categoryId" th:value="${cat.id}" />
                                                <button type="submit" class="btn btn-outline-danger btn-sm"
                                                        onclick="return confirm('Delete this category?')">
                                                    <i class="fas fa-trash-can"></i> Delete
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${categories == null or #lists.isEmpty(categories)}">
                                        <td colspan="4" class="text-center py-4 text-muted">No categories defined yet.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>
</html>
