<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile – Quickread Admin</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>
<body>

    <!-- Dedicated Admin Header -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- Alerts -->
                    <div th:if="${error != null or message != null}" class="mb-4">
                        <div class="editorial-alert editorial-alert-danger" th:if="${error}">
                            <i class="fas fa-exclamation-circle"></i>
                            <span th:text="${error}">Error</span>
                        </div>
                        <div class="editorial-alert editorial-alert-success" th:if="${message}">
                            <i class="fas fa-check-circle"></i>
                            <span th:text="${message}">Success</span>
                        </div>
                    </div>

                    <div class="card border-0 shadow-md p-4 p-md-5" style="background: var(--card-bg); border: 1px solid var(--border-color) !important; border-radius: var(--radius-lg);">
                        <div class="d-flex align-items-center justify-content-between gap-3 mb-4 pb-4 border-bottom">
                            <div class="d-flex align-items-center gap-3">
                                <div class="brand-monogram" style="width: 60px; height: 60px; font-size: 1.5rem;">
                                    <i class="fas fa-user-shield"></i>
                                </div>
                                <div>
                                    <span class="section-subtitle-tag mb-1">Administrator Credentials</span>
                                    <h1 class="font-heading fs-2 mb-0" th:text="${adminUser.username}">Admin</h1>
                                    <small class="text-muted" th:text="${adminUser.email}">admin@domain.com</small>
                                </div>
                            </div>
                            <span class="badge bg-dark px-3 py-2">ROLE: ADMIN</span>
                        </div>

                        <form th:action="@{/admin/profile}" method="post">
                            <div class="row g-4">
                                <div class="col-md-6 auth-form-group">
                                    <label for="username" class="auth-form-label">Admin Username</label>
                                    <input type="text" id="username" name="username" class="auth-input-field" th:value="${adminUser.username}" required />
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="email" class="auth-form-label">Admin Email</label>
                                    <input type="email" id="email" name="email" class="auth-input-field" th:value="${adminUser.email}" required />
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="mobile" class="auth-form-label">Contact Mobile</label>
                                    <input type="tel" id="mobile" name="mobile" class="auth-input-field" th:value="${adminUser.mobileno}" maxlength="15" />
                                </div>

                                <div class="col-md-6"></div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="currentPassword" class="auth-form-label">Current Password (Required only to change password)</label>
                                    <input type="password" id="currentPassword" name="currentPassword" class="auth-input-field" placeholder="Enter current password" />
                                </div>

                                <div class="col-md-6 auth-form-group">
                                    <label for="newPassword" class="auth-form-label">New Password (Optional)</label>
                                    <input type="password" id="newPassword" name="newPassword" class="auth-input-field" placeholder="Leave blank to retain current" />
                                </div>
                            </div>

                            <div class="d-flex align-items-center justify-content-between mt-5 pt-3 border-top">
                                <a th:href="@{/admin/dashboard}" class="btn-luxury-outline py-2 px-3">
                                    <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
                                </a>
                                <button type="submit" class="btn-luxury-primary py-2 px-4">
                                    <i class="fas fa-save me-2"></i> Save Admin Profile
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>
</html>
