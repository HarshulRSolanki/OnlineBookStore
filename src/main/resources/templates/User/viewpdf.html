<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Preview: ' + ${bookTitle} + ' – Quickread'">Preview PDF – Quickread</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>
<body>

    <!-- Header Navigation -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                <div>
                    <span class="section-subtitle-tag mb-1">Digital Preview</span>
                    <h1 class="font-heading fs-2 mb-0" th:text="${bookTitle}">Sample Reader</h1>
                </div>
                <div class="d-flex gap-2">
                    <a href="javascript:history.back()" class="btn-luxury-outline py-2 px-3">
                        <i class="fas fa-arrow-left me-1"></i> Back
                    </a>
                    <a th:if="${bookId != null}" th:href="@{/checkout/{bookId}(bookId=${bookId})}" class="btn-luxury-primary py-2 px-3">
                        <i class="fas fa-bolt me-1"></i> Buy Full Book
                    </a>
                </div>
            </div>

            <div class="card border-0 shadow-md p-2" style="background: var(--card-bg); border: 1px solid var(--border-color) !important; border-radius: var(--radius-lg); overflow: hidden;">
                <iframe th:src="@{/getpdf/{id}(id=${bookId})}" width="100%" height="750px" style="border: none; border-radius: var(--radius-sm);"></iframe>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>
</html>
