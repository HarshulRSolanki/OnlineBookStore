<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('/img/free book.jpg');
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            padding: 1rem;
        }

        .glass-blur {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .password-container {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            margin: 1rem;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
            text-align: center;
            font-weight: 600;
        }

        .password-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding-right: 2.5rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: #1877f2;
            box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            color: #65676b;
            background: none;
            border: none;
            padding: 0;
        }

        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
            position: relative;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            position: absolute;
            left: 0;
            top: 0;
            transition: all 0.3s ease;
        }

        button {
            background: #1877f2;
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background: #166fe5;
            transform: translateY(-1px);
        }

        .requirements {
            color: #4a5568;
            font-size: 0.875rem;
            margin-top: 1.5rem;
        }

        .requirements ul {
            list-style: none;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .requirements li {
            margin-bottom: 0.5rem;
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .requirements li::before {
            content: '•';
            color: #1877f2;
            font-size: 1.2rem;
            line-height: 1;
        }

        @media (max-width: 480px) {
            .password-container {
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .input-group input {
                padding: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="password-container glass-blur">
        <h1>Create New Password</h1>
        <form th:action="@{/newpass}" method="post" class="password-form">
            <input type="hidden" name="email" th:value="${email}">
            
            <div class="input-group">
                <input type="password" name="newPassword" id="new-password" 
                       placeholder="New Password" required>
                <button type="button" class="toggle-password">👁️</button>
                <div class="password-strength">
                    <div class="strength-bar"></div>
                </div>
            </div>
            
            <div class="input-group">
                <input type="password" name="confirmPassword" id="confirm-password" 
                       placeholder="Confirm New Password" required>
                <button type="button" class="toggle-password">👁️</button>
            </div>

            <button type="submit">Reset Password</button>

            <div class="requirements">
                <p>Your password must contain:</p>
                <ul>
                    <li>At least 8 characters</li>
                    <li>One uppercase letter</li>
                    <li>One number</li>
                    <li>One special character</li>
                </ul>
            </div>
        </form>
    </div>

    <script>
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                this.textContent = type === 'password' ? '👁️' : '👁️';
            });
        });

        const passwordInput = document.getElementById('new-password');
        const strengthBar = document.querySelector('.strength-bar');

        passwordInput.addEventListener('input', function() {
            const strength = calculatePasswordStrength(this.value);
            updateStrengthIndicator(strength);
        });

        function calculatePasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            return strength;
        }

        function updateStrengthIndicator(strength) {
            const colors = ['#ff4444', '#ff9100', '#ffd600', '#00c853'];
            const widths = ['25%', '50%', '75%', '100%'];
            
            strengthBar.style.width = widths[strength - 1] || '0%';
            strengthBar.style.backgroundColor = colors[strength - 1] || '#e0e0e0';
        }
    </script>
</body>
</html>
