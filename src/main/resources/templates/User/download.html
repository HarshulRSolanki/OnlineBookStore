<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloaded Editions – Quickread</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>
<body>

    <!-- Header Navigation -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                <div>
                    <span class="section-subtitle-tag mb-1">Personal Archive</span>
                    <h1 class="font-heading fs-2 mb-0">Downloaded Editions</h1>
                </div>
                <a href="/" class="btn-luxury-outline py-2 px-3">
                    <i class="fas fa-compass me-1"></i> Explore Books
                </a>
            </div>

            <div th:if="${Books != null and not #lists.isEmpty(Books)}" class="orders-table-wrapper">
                <div class="table-responsive">
                    <table class="luxury-table">
                        <thead>
                            <tr>
                                <th>Book Title</th>
                                <th class="text-end">Read / Access</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book : ${Books}">
                                <td>
                                    <h5 class="font-heading fs-6 mb-0 text-dark" th:text="${book.title}">Book Title</h5>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{'/books/read/' + ${book.id}}" target="_blank" class="btn-luxury-primary py-1 px-3" style="font-size: 0.85rem;">
                                        <i class="fas fa-book-open me-1"></i> Read Edition
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:if="${Books == null or #lists.isEmpty(Books)}" class="empty-state-card">
                <div class="empty-state-icon">
                    <i class="fas fa-file-arrow-down"></i>
                </div>
                <h3 class="font-heading mb-2">No Downloaded Books</h3>
                <p class="text-secondary mb-4">You have not downloaded any editions to this device yet.</p>
                <a href="/#curated-books" class="btn-luxury-primary py-2 px-4">
                    Explore Curated Titles
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>
</html>
