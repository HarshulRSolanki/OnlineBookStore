<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration | E-Book Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
        }
		body {
					        background-color: var(--light-bg);
							background-image:url('/img/free book.jpg'); 
					        min-height: 100vh;
					        display: flex;
							background-size: cover;                 /* makes the image cover the container */
							background-position: center center;     /* centers the image */
					        background-repeat: no-repeat;
							width: 100%; 
					        flex-direction: column;
					        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
					}
					.glass-blur {
					    background: rgba(255, 255, 255, 0.15); /* slight white tint */
					    backdrop-filter: blur(10px);           /* the blur effect */
					    -webkit-backdrop-filter: blur(10px);   /* Safari support */
					    border-radius: 16px;
					    border: 1px solid rgba(255, 255, 255, 0.2);
					}
        .registration-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .registration-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: var(--secondary-color);
            color: white;
            text-align: center;
            padding: 2rem;
            border-bottom: none;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(52,152,219,0.1);
        }

        .input-group-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            z-index: 4;
        }

        .btn-register {
            background: linear-gradient(135deg, var(--secondary-color), #2980b9);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52,152,219,0.3);
        }

        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }

        .social-login {
            border-top: 1px solid #eee;
            padding-top: 1.5rem;
            margin-top: 2rem;
        }

        @media (max-width: 576px) {
            .registration-card {
                margin: 0 1rem;
                border-radius: 15px;
            }
            
            .card-header {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
	
	<div th:replace="common/header :: navbar"></div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="registration-card glass-blur">
        <div class="card-header">
            <h2 class="mb-0">Create Your Account</h2>
        </div>
        <div class="card-body p-4">
            <form action="/userreg" method="post" onsubmit="return validateForm()">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name" class="form-label">Full Name</label>
                            <div class="position-relative">
                                <input type="text" name="name" id="name" 
                                       class="form-control" 
                                       placeholder="Enter Your Name"
                                       required>
                                <i class="fas fa-user input-group-icon"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="mobilenumber" class="form-label">Phone Number</label>
                            <div class="position-relative">
                                <input type="tel" name="mobilenumber" id="mobilenumber" 
                                       class="form-control" 
                                       placeholder="Enter a mobile number"
                                       pattern="[0-9]{10}"
                                       required>
                                <i class="fas fa-phone input-group-icon"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="position-relative">
                        <input type="email" name="email" id="email" 
                               class="form-control" 
                               placeholder="Enter An Email"
                               required>
                        <i class="fas fa-envelope input-group-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="position-relative">
                        <input type="password" name="password" id="password" 
                               class="form-control" 
                               placeholder="Enter a Password"
                               required
                               onkeyup="checkPasswordStrength(this.value)">
                        <i class="fas fa-lock input-group-icon"></i>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="password-strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="position-relative">
                        <input type="password" name="confirm_password" id="confirm_password" 
                               class="form-control" 
                               placeholder="ReEnter Password"
                               required>
                        <i class="fas fa-lock input-group-icon"></i>
                    </div>
                
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-register">
                        <i class="fas fa-user-plus me-2"></i>Create Account
                    </button>
                </div>

               

                <div class="text-center mt-4">
                    <p class="mb-0">Already have an account? 
                        <a href="/login" class="text-decoration-none fw-bold">Login here</a>
                    </p>
                </div>

                <div class="mt-3 text-center">
                    <span class="text-danger" th:text="${error}"></span>
                    <span class="text-success" th:text="${message}"></span>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="footer mt-auto">
        <div th:replace="common/footer :: footer"></div>
    </div>
<script>
    function checkPasswordStrength(password) {
        const strengthBar = document.getElementById('password-strength-bar');
        const strength = {
            0: {color: '#e74c3c', width: '20%'},
            1: {color: '#e74c3c', width: '40%'},
            2: {color: '#f1c40f', width: '60%'},
            3: {color: '#2ecc71', width: '80%'},
            4: {color: '#2ecc71', width: '100%'}
        };
        
        let score = 0;
        if (password.length >= 8) score++;
        if (password.match(/[A-Z]/)) score++;
        if (password.match(/[0-9]/)) score++;
        if (password.match(/[^A-Za-z0-9]/)) score++;
        
        strengthBar.style.backgroundColor = strength[score].color;
        strengthBar.style.width = strength[score].width;
    }

    function validateForm() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const matchText = document.getElementById('password-match');
        
        if (password !== confirmPassword) {
            matchText.textContent = "Passwords do not match!";
            matchText.style.color = "#e74c3c";
            return false;
        }
        matchText.textContent = "Passwords match!";
        matchText.style.color = "#2ecc71";
        return true;
    }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
