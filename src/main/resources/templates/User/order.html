<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
		body {
					        background-color: var(--light-bg);
							background-image:url('/img/free book.jpg'); 
					        min-height: 100vh;
					        display: flex;
							background-size: cover;                 /* makes the image cover the container */
							background-position: center center;     /* centers the image */
					        background-repeat: no-repeat;
							width: 100%; 
					        flex-direction: column;
					        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
					}
					.glass-blur {
					    background: rgba(255, 255, 255, 0.15); /* slight white tint */
					    backdrop-filter: blur(10px);           /* the blur effect */
					    -webkit-backdrop-filter: blur(10px);   /* Safari support */
					    border-radius: 16px;
					    border: 1px solid rgba(255, 255, 255, 0.2);
					}

        .orders-container {
            max-width: 1000px;
            margin: 0 auto;
            
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 2rem;
        }

        h1 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
        }

        .order-table {
            width: 100%;
           
            border-collapse: separate;
            border-spacing: 0 1rem;
            align-content: center;
        }

        .order-table thead th {
            background-color: #2c3e50;
            
            padding: 1.2rem;
            font-size: 1.1rem;
        }

        .order-table tbody tr {
           
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 10px;
        }

        .order-table tbody tr:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .order-table td {
            padding: 1.2rem;
            vertical-align: middle;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-paid {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .status-pending {
            background-color: #ffecb3;
            color: #f57f17;
        }

        .download-btn {
            background-color: #3498db;
            color: white !important;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.3s;
        }

        .download-btn:hover {
            background-color: #2980b9;
            text-decoration: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background-color: #2c3e50;
            color: white !important;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .back-link:hover {
            transform: translateX(-3px);
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
	<div th:replace="common/header :: navbar"></div>
    <div class="orders-container glass-blur">
        <h1><i class="fas fa-receipt me-3"></i>My Orders</h1>
        
        <div class="table-responsive glass-blur">
            <table class="order-table text-center">
                <thead>
                    <tr>
                        <th>Book Title</th>
                        <th>Price</th>
                        <th>Payment Status</th>
						
                        <th>Download</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.book.title}"></td>
                        <td style="font-weight: 600; color: #2c3e50;" th:text="'₹' + ${#numbers.formatDecimal(order.amount, 1, 2)}"></td>
                        <td>
                            <span th:classappend="${order.paymentStatus == 'PAID'} ? 'status-paid' : 'status-pending'" 
                                  class="status-badge"
                                  th:text="${order.paymentStatus}">
                            </span>
                        </td>
					<!--	<td th:text="${order.orderDate}">
							
						--></td>
                        <td>
                            <a th:href="@{/download/{id}(id=${order.book.id})}" class="download-btn">
                                <i class="fas fa-download"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center">
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>
	<div class="footer mt-auto">
	        <div th:replace="common/footer :: footer"></div>
	    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
