<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
		body {
					        background-color: var(--light-bg);
							background-image:url('/img/free book.jpg'); 
					        min-height: 100vh;
					        display: flex;
							background-size: cover;                 /* makes the image cover the container */
							background-position: center center;     /* centers the image */
					        background-repeat: no-repeat;
							width: 100%; 
					        flex-direction: column;
					        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
					}
					.glass-blur {
					    background: rgba(255, 255, 255, 0.15); /* slight white tint */
					    backdrop-filter: blur(10px);           /* the blur effect */
					    -webkit-backdrop-filter: blur(10px);   /* Safari support */
					    border-radius: 16px;
					    border: 1px solid rgba(255, 255, 255, 0.2);
					}
        .container {
          
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 1050px;
        }
        h2 {
            color: rgb(0, 0, 0);
            margin-bottom: 20px;
            text-align: center;
        }
        .form-label {
            font-weight: bold;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
           
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .form-text {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div th:replace="common/header :: navbar"></div>
<div class="container mt-5 glass-blur">
    <h2 class="fw-bold text-light">Edit Profile</h2>
    <form th:action="@{/updateProfile/{userId}(userId=${user.userid})}" method="post">
      <!--  <input type="hidden" name="userId" th:value="${user.userid}"/>-->  
        
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" th:value="${user.username}" required>
        </div>
        
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${user.email}" required>
        </div>
        
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password">
            <small class="form-text text-muted">Leave blank to keep current password.</small>
        </div>
        
        <div class="mb-3">
            <label for="mobile" class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" id="mobile" name="mobile" th:value="${user.mobileno}" required pattern="[0-9]{10}" maxlength="10">
            <small class="form-text text-muted">Enter a 10-digit mobile number.</small>
        </div>
			<div class="text-center"> 
			<button type="submit" class="btn btn-primary ">Update
				Profile</button>
			</div>
		</form>
</div>
<div class="footer mt-auto">
        <div th:replace="common/footer :: footer"></div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
