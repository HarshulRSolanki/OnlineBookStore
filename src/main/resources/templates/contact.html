<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Book Haven - Contact Us</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<style>
			body 
			{
				background-color: var(--light-bg);
				background-image:url('/img/free book.jpg'); 
			    min-height: 100vh;
			    display: flex;
				background-size: cover;                 /* makes the image cover the container */
				background-position: center center;     /* centers the image */
			    background-repeat: no-repeat;
				width: 100%; 
			    flex-direction: column;
			    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			 }
			 .glass-blur {
			     background: rgba(255, 255, 255, 0.15); /* slight white tint */
			     backdrop-filter: blur(10px);           /* the blur effect */
			     -webkit-backdrop-filter: blur(10px);   /* Safari support */
			     border-radius: 16px;
			     border: 1px solid rgba(255, 255, 255, 0.2);
			 }

</style>
</head>
<body>
    
	<div th:replace="common/header :: navbar"></div>

    <!-- Main Content -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="container">
            
            <div class="row justify-content-center">
                <!-- Contact Form Section -->
                <div class="col-lg-6">
                    <div class="card glass-blur border-0 shadow-lg">
                        <div class="card-body p-4">
                            <h2 class="card-title text-center mb-4">Send us a Message</h2>
                            <form th:action="@{/contact}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" name="name" required
                                           placeholder="John Doe">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" class="form-control" name="email" required
                                           placeholder="john@example.com">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Subject</label>
                                    <select class="form-select" name="subject" required>
                                        <option value="">Select a subject</option>
                                        <option>Order Inquiry</option>
                                        <option>Shipping Question</option>
                                        <option>Book Suggestion</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Message</label>
                                    <textarea class="form-control" rows="5" name="message" required
                                              placeholder="Type your message here..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100">
                                    <i class="fas fa-paper-plane me-2"></i>Send Message
                                </button>
								
								<div th:if="${success}" class="alert alert-success text-center">
								    <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
								</div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

   <div th:replace="common/footer :: footer"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
