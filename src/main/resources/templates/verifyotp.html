<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Security Code – Quickread</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>
<body>

    <!-- Header Navigation -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="auth-single-card">
            <div class="text-center mb-4">
                <div class="brand-monogram mx-auto mb-3">
                    <i class="fas fa-key"></i>
                </div>
                <span class="section-subtitle-tag mb-1">Two-Step Verification</span>
                <h2 class="font-heading fs-2 mb-2">Verify Your Code</h2>
                <p class="text-secondary small mb-0">
                    We have transmitted a secure verification OTP to:
                </p>
                <div class="fw-bold mt-1 text-dark" th:text="${email}">reader@domain.com</div>
            </div>

            <!-- Alerts -->
            <div class="editorial-alert editorial-alert-danger" th:if="${error}">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Invalid code</span>
            </div>
            <div class="editorial-alert editorial-alert-success" th:if="${message}">
                <i class="fas fa-check-circle"></i>
                <span th:text="${message}">Code sent</span>
            </div>

            <!-- OTP Verification Form -->
            <form th:action="@{/verify-otp}" method="post">
                <input type="hidden" name="email" th:value="${email}">

                <div class="auth-form-group mb-4">
                    <label for="otp" class="auth-form-label">One-Time Password (OTP)</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-shield-alt auth-input-icon"></i>
                        <input type="text" class="auth-input-field text-center letter-spacing-2 fs-5 fw-bold" id="otp" name="otp" required placeholder="Enter OTP Code" autofocus maxlength="8" />
                    </div>
                </div>

                <button type="submit" class="btn-luxury-primary w-100 py-3">
                    <i class="fas fa-check-circle me-2"></i> Confirm &amp; Proceed
                </button>
            </form>

            <!-- Resend OTP Form -->
            <form th:action="@{/resend-otp}" method="post" class="mt-3">
                <input type="hidden" name="email" th:value="${email}">
                <button type="submit" class="btn btn-luxury-outline w-100 py-2">
                    <i class="fas fa-rotate-right me-1"></i> Resend Verification Code
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <a href="/login" class="text-decoration-none small text-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>
</html>
