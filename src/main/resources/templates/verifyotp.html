<!DOCTYPE html>
<html>
<head>
	<style>
		body {
					        background-color: var(--light-bg);
							background-image:url('/img/free book.jpg'); 
					        min-height: 100vh;
					        display: flex;
							background-size: cover;                 /* makes the image cover the container */
							background-position: center center;     /* centers the image */
					        background-repeat: no-repeat;
							width: 100%; 
					        flex-direction: column;
					        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
					}
					.glass-blur {
					    background: rgba(255, 255, 255, 0.15); /* slight white tint */
					    backdrop-filter: blur(10px);           /* the blur effect */
					    -webkit-backdrop-filter: blur(10px);   /* Safari support */
					    border-radius: 16px;
					    border: 1px solid rgba(255, 255, 255, 0.2);
					}
	</style>
<meta charset="UTF-8">
<title>Verify Otp</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
	<div th:replace="common/header :: navbar"></div>
<div class="container d-flex justify-content-center align-items-center vh-100 ">
    <div class="card p-4  glass-blur" style="width: 400px;">
        <h3 class="text-center">Verify OTP</h3>
        <p class="text-muted text-center">Enter the OTP sent to your email</p>

        <!-- OTP Verification Form -->
        <form th:action="@{/verify-otp}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            
            <div class="mb-3">
                <label for="otp" class="form-label">OTP</label>
                <input type="text" class="form-control" id="otp" name="otp" required placeholder="Enter OTP">
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
        </form>

        <!-- Resend OTP Form -->
        <form th:action="@{/resend-otp}" method="post" class="mt-3">
            <input type="hidden" name="email" th:value="${email}">
            <button type="submit" class="btn btn-secondary w-100">Resend OTP</button>
        </form>

        <!-- Error & Success Messages -->
        <div class="mt-3 text-center">
            <span class="text-danger" th:text="${error}"></span>
            <span class="text-success" th:text="${message}"></span>
    	</div>  
    </div>
	
</div>
<div th:replace="common/footer :: footer"></div>
</body>
</html>
