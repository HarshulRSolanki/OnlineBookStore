<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta http-equiv="refresh" th:content="'0; url=/orders/' + ${order.id} + '/receipt'" content="0; url=/order">
</head>
<body>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var orderId = /*[[${order != null ? order.id : ''}]]*/ '';

            window.location.href = '/orders/' + orderId + '/receipt';
        } else {
            window.location.href = '/order';
        }
        /*]]>*/
    </script>
</body>
</html>
