<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – Quickread Luxury Bookstore</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>

<body>

    <!-- Header Navigation -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="auth-single-card">
            <!-- Header -->
            <div class="text-center mb-4">
                <div class="brand-monogram mx-auto mb-3">Q</div>
                <span class="section-subtitle-tag mb-1">Account Recovery</span>
                <h2 class="font-heading fs-2 mb-2">Reset Password</h2>
                <p class="text-secondary small mb-0">
                    Enter the email address registered with your reader profile. We will dispatch a single-use
                    verification code (OTP).
                </p>
            </div>

            <!-- Alerts -->
            <div class="editorial-alert editorial-alert-danger" th:if="${error}">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Email not found</span>
            </div>

            <!-- Form -->
            <form th:action="@{/forgetpwd}" method="post">
                <div class="auth-form-group mb-4">
                    <label for="email" class="auth-form-label">Registered Email Address</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-envelope auth-input-icon"></i>
                        <input type="email" name="email" id="email" class="auth-input-field"
                            placeholder="yourname@domain.com" required autofocus />
                    </div>
                </div>

                <button type="submit" class="btn-luxury-primary w-100 py-3">
                    <i class="fas fa-paper-plane me-2"></i> Send Recovery Code
                </button>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="/login" class="text-decoration-none small text-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Return to Sign In
                    </a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>

</html>
