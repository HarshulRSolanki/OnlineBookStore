<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – Quickread Luxury Bookstore</title>

    <!-- Bootstrap 5 & Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Luxury Editorial Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/luxury-bookstore.css}" href="/css/luxury-bookstore.css">
</head>
<body>

    <!-- Header Navigation -->
    <div th:replace="~{common/header :: navbar}"></div>

    <main class="auth-split-wrapper">
        <div class="auth-card-editorial">
            <!-- Left Hero Panel -->
            <div class="auth-hero-side">
                <div class="auth-hero-ornament">Q</div>
                <div>
                    <a href="/" class="brand-wrapper text-decoration-none mb-4 d-inline-flex">
                        <div class="brand-monogram">Q</div>
                        <div class="brand-text-block">
                            <span class="brand-name text-white">Quickread</span>
                            <span class="brand-tagline" style="color: var(--gold-accent);">The Reader's Atelier</span>
                        </div>
                    </a>
                </div>

                <div class="auth-quote-box">
                    <p class="auth-quote-text">
                        "Books are a uniquely portable magic."
                    </p>
                    <span class="auth-quote-author">— Stephen King</span>
                </div>

                <div class="d-flex align-items-center gap-2 small" style="color: #DFC293;">
                    <i class="fas fa-shield-halved"></i>
                    <span>Privacy First &bull; Zero Spam Guarantee</span>
                </div>
            </div>

            <!-- Right Form Panel -->
            <div class="auth-form-side">
                <div class="auth-form-header">
                    <span class="section-subtitle-tag mb-1">Begin Your Journey</span>
                    <h2 class="auth-form-title">Join Quickread</h2>
                    <p class="auth-form-subtitle">Create your personal reader dossier and library archive.</p>
                </div>

                <!-- Alert Messages -->
                <div class="editorial-alert editorial-alert-danger" th:if="${error}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:text="${error}">Registration error</span>
                </div>
                <div class="editorial-alert editorial-alert-success" th:if="${message}">
                    <i class="fas fa-check-circle"></i>
                    <span th:text="${message}">Message</span>
                </div>

                <!-- Registration Form -->
                <form th:action="@{/userreg}" method="post" id="registrationForm">
                    <div class="row g-3">
                        <!-- Full Name / Username -->
                        <div class="col-md-6 auth-form-group">
                            <label for="name" class="auth-form-label">Username</label>
                            <div class="auth-input-wrapper">
                                <i class="fas fa-user auth-input-icon"></i>
                                <input type="text" name="name" id="name" class="auth-input-field" placeholder="Username (3-20 chars)" minlength="3" maxlength="20" required autofocus />
                            </div>
                        </div>

                        <!-- Mobile Number -->
                        <div class="col-md-6 auth-form-group">
                            <label for="mobilenumber" class="auth-form-label">Mobile Number</label>
                            <div class="auth-input-wrapper">
                                <i class="fas fa-phone auth-input-icon"></i>
                                <input type="tel" name="mobilenumber" id="mobilenumber" class="auth-input-field" placeholder="e.g. 9876543210" minlength="7" maxlength="15" required />
                            </div>
                        </div>
                    </div>

                    <!-- Email Address -->
                    <div class="auth-form-group">
                        <label for="email" class="auth-form-label">Email Address</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-envelope auth-input-icon"></i>
                            <input type="email" name="email" id="email" class="auth-input-field" placeholder="reader@example.com" required />
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="auth-form-group">
                        <label for="password" class="auth-form-label">Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-lock auth-input-icon"></i>
                            <input type="password" name="password" id="password" class="auth-input-field" placeholder="Create a strong password" required />
                            <button type="button" class="password-toggle-btn" title="Toggle visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="auth-form-group">
                        <label for="confirm_password" class="auth-form-label">Confirm Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-shield-alt auth-input-icon"></i>
                            <input type="password" name="confirm_password" id="confirm_password" class="auth-input-field" placeholder="Re-enter password" required />
                            <button type="button" class="password-toggle-btn" title="Toggle visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-luxury-primary w-100 py-3 mt-3">
                        <i class="fas fa-user-plus me-2"></i> Register &amp; Verify Email
                    </button>

                    <!-- Sign In Link -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-secondary small">Already have an account?</span>
                        <a href="/login" class="ms-1 fw-bold text-decoration-none" style="color: var(--primary-accent);">
                            Sign In Here &rarr;
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{common/footer :: footer}"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/luxury-bookstore.js}" src="/js/luxury-bookstore.js"></script>
</body>
</html>
