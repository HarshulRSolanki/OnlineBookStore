<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

		
		body {
				        
						background-image:url('/img/free book.jpg'); 
				       
				        display: flex;
						justify-content: center;
						align-items: center;
						background-size: cover;                 /* makes the image cover the container */
						background-position: center center;     /* centers the image */
				        background-repeat: no-repeat;
						width: 100%; 
				        flex-direction: column;
				        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				}
				.glass-blur {
				    background: rgba(255, 255, 255, 0.15); /* slight white tint */
				    backdrop-filter: blur(10px);           /* the blur effect */
				    -webkit-backdrop-filter: blur(10px);   /* Safari support */
				    border-radius: 16px;
				    border: 1px solid rgba(255, 255, 255, 0.2);
				}

		

        .book-container {
           
			color: black;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            max-width: 1200px;
            width: 100%;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .book-container:hover {
            transform: translateY(-5px);
        }

        .book-image {
            flex: 1;
            background: #f8f9fb;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 700px;
        }

        .book-image img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .book-image img:hover {
            transform: scale(1.03);
        }

        .book-details {
            flex: 1.2;
            padding: 2.5rem;
            position: relative;
        }

        .book-details h2 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .detail-item {
            margin-bottom: 1.2rem;
            padding: 0.8rem 0;
            border-bottom: 1px solid #eee;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-item strong {
            color: #7f8c8d;
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .detail-item span {
            color: #2c3e50;
            font-size: 1rem;
        }

        .free-label {
            background: #2ecc71;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
        }

        .buttons {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
        }

        .button {
            flex: 1;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .button.add-to-cart {
            background: #3498db;
            color: white;
            height: 50px;
            width: 175px;
        }

        .button.add-to-cart:hover {
            background: #2980b9;
        }

        .button.download {
            background: rgb(0, 128, 255);
            color: white;
            height: 50px;
            width: 175px;
        }

        .button i {
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .book-container {
                flex-direction: column;
                max-width: 500px;
            }

            .book-image {
                min-height: 300px;
                padding: 1.5rem;
            }

            .book-details {
                padding: 1.5rem;
            }
        }

        /* Back Button */
        .back-button {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: rgba(255,255,255,0.9);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

    </style>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
	
	
    <a href="/" class="back-button">
        <i class="fas fa-arrow-left"></i>
        Back
    </a>

	
	
	
    <div class="book-container glass-blur">
        <!-- Book Cover Image -->
        <div class="book-image glass-blur">
            <img th:src="${bookImage}" alt="Book Cover" class="book-cover">
        </div>

        <!-- Book Details -->
        <div class="book-details">
            <h2 th:text="${book.title}">Book Title</h2>
            
            <div class="detail-item">
                <strong>Author</strong>
                <span th:text="${book.author}"></span>
            </div>

            <div class="detail-item">
                <strong>Category</strong>
                <span th:text="${book.category.name}"></span>
            </div>

            <div class="detail-item">
                <strong>Price</strong>
                <span th:if="${book.price == 0}" class="free-label">Free </span>
                <span th:unless="${book.price == 0}" th:text="${book.price}"></span>
            </div>
            
       		<div class="detail-item">
                <strong>Publisher name</strong>
                <span th:text="${book.publishername}"></span>
            </div>      

            <div class="detail-item">
                <strong>Publication Date ( year-month-day )</strong>
                <span th:text="${book.publishDate}"></span>
                
            </div>

            <div class="detail-item">
                <strong>Language</strong>
                <span th:text="${book.language}"></span>
            </div>

            <div class="detail-item">
                <strong>Description</strong>
                <p style="color: #666; line-height: 1.5; margin-top: 0.5rem;" th:text="${book.description}"></p>
            </div>

            <div class="buttons">             
                <a th:href="@{/viewpdf/{id}(id=${book.id})}" class="button download">                  
                    preview
                </a>
            </div>
        </div>
    </div>
	
</body>
</html>
